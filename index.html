<!DOCTYPE html>
<html lang=”ar” dir=”rtl”>
<head>
<meta charset=”UTF-8”>
<meta name=”viewport” content=”width=device-width, initial-scale=1.0”>
<title>اختبار التوظيف</title>
<style>
Body {
  Background: #3a0d0d;
  Color: #f5e6d3;
  Font-family: “Georgia”, “Times New Roman”, serif;
  Display: flex;
  Justify-content: center;
  Align-items: center;
  Min-height: 90vh;
  Margin: 0;
  Padding: 0;
}

.container {
  Max-width: 90%;
  Width: 400px;
  Text-align: right;
  Background: #2b0909;
  Border: 8px double #b8860b;
  Padding: 30px 20px;
  Box-shadow: 0 0 30px rgba(0,0,0,0.7);
  Position: relative;
}

/* زخرفة الستارة العلوية والسفلية */
.container::before {
  Content: “🎪”;
  Font-size: 2rem;
  Display: block;
  Text-align: center;
  Opacity: 0.7;
}

.container::after {
  Content: “”;
  Display: block;
  Height: 4px;
  Background: repeating-linear-gradient(90deg, #b8860b 0px, #b8860b 4px, transparent 4px, transparent 8px);
  Margin-top: 20px;
  Opacity: 0.6;
}

H2 {
  Color: #f5e6d3;
  Font-size: 1.5rem;
  Text-align: center;
  Margin-bottom: 20px;
  Text-shadow: 1px 1px 3px #000;
}

.step { display: none; }
.step.active { display: block; }

Textarea {
  Width: 100%;
  Background: #4a1515;
  Color: #f5e6d3;
  Border: 2px solid #8b6914;
  Padding: 10px;
  Margin: 10px 0;
  Font-family: georgia, serif;
  Box-sizing: border-box;
  Outline: none;
}

Textarea::placeholder {
  Color: #c4a882;
  Opacity: 0.8;
}

Button {
  Background: #8b1a1a;
  Color: #f5e6d3;
  Border: 2px solid #b8860b;
  Padding: 10px 30px;
  Cursor: pointer;
  Font-family: georgia, serif;
  Font-size: 1rem;
  Margin-top: 10px;
  Width: 100%;
  Transition: 0.3s;
}

Button:hover {
  Background: #b8860b;
  Color: #2b0909;
}

#exitIcon {
  Cursor: pointer;
  Font-size: 2rem;
  Display: block;
  Text-align: center;
  Margin-top: 20px;
}

#clownImage {
  Display: none;
  Max-width: 100%;
  Margin-top: 20px;
  Border: 3px solid #8b6914;
  Border-radius: 8px;
}
</style>
</head>
<body>
<div class=”container”>
  <!—الخطوة 1: البداية 
  <div id=”step1” class=”step active”>
    <h2>هل تجد نفسك مرحاً؟</h2>
    <button onclick=”startTest()”>ابدأ الاختبار</button>
  </div>

  <!—الخطوة 2: مهارات الكوميديا اللفظية 
  <div id=”step2” class=”step”>
    <h2>أولاً: مهارات الكوميديا اللفظية</h2>
    <textarea id=”joke” rows=”4” placeholder=”اكتب نكتة واحدة هنا"></textarea>
    <br>
    <button onclick=”submitJoke()”>إرسال</button>
  </div>

  <!—الخطوة 3: الرفض 
  <div id=”step3” class=”step”>
    <p>لقد تم تقييم النكتة.</p>
    <p>أنت لست مضحكاً بما يكفي.</p>
    <p>لقد فشلت في الاختبار.</p>
    <div id=”exitIcon” onclick=”showClown()”>🚪</div>
    <img id=”clownImage” src=https://cdn-icons-png.flaticon.com/512/7422/7422817.png alt=”مهرج يبكي">
  </div>
</div>

<script>
Function startTest() {
  Document.getElementById(‘step1’).classList.remove(‘active’);
  Document.getElementById(‘step2’).classList.add(‘active’);
}

Function submitJoke() {
  Document.getElementById(‘step2’).classList.remove(‘active’);
  Document.getElementById(‘step3’).classList.add(‘active’);
}

Function showClown() {
  Document.getElementById(‘clownImage’).style.display = ‘block’;
}
</script>
</body>
</html>
