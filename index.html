<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التوظيف</title>
<style>
body {
  background: #3a0d0d;
  color: #f5e6d3;
  font-family: "Georgia", "Times New Roman", serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90vh;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 90%;
  width: 400px;
  text-align: right;
  background: #2b0909;
  border: 8px double #b8860b;
  padding: 30px 20px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
  position: relative;
}

/* زخرفة الستارة العلوية والسفلية */
.container::before {
  content: "🎪";
  font-size: 2rem;
  display: block;
  text-align: center;
  opacity: 0.7;
}

.container::after {
  content: "";
  display: block;
  height: 4px;
  background: repeating-linear-gradient(90deg, #b8860b 0px, #b8860b 4px, transparent 4px, transparent 8px);
  margin-top: 20px;
  opacity: 0.6;
}

h2 {
  color: #f5e6d3;
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 20px;
  text-shadow: 1px 1px 3px #000;
}

.step { display: none; }
.step.active { display: block; }

textarea {
  width: 100%;
  background: #4a1515;
  color: #f5e6d3;
  border: 2px solid #8b6914;
  padding: 10px;
  margin: 10px 0;
  font-family: georgia, serif;
  box-sizing: border-box;
  outline: none;
}

textarea::placeholder {
  color: #c4a882;
  opacity: 0.8;
}

button {
  background: #8b1a1a;
  color: #f5e6d3;
  border: 2px solid #b8860b;
  padding: 10px 30px;
  cursor: pointer;
  font-family: georgia, serif;
  font-size: 1rem;
  margin-top: 10px;
  width: 100%;
  transition: 0.3s;
}

button:hover {
  background: #b8860b;
  color: #2b0909;
}

#exitIcon {
  cursor: pointer;
  font-size: 2rem;
  display: block;
  text-align: center;
  margin-top: 20px;
}

#clownImage {
  display: none;
  max-width: 100%;
  margin-top: 20px;
  border: 3px solid #8b6914;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
  <!-- الخطوة 1: البداية -->
  <div id="step1" class="step active">
    <h2>هل تجد نفسك مرحاً؟</h2>
    <button onclick="startTest()">ابدأ الاختبار</button>
  </div>

  <!-- الخطوة 2: مهارات الكوميديا اللفظية -->
  <div id="step2" class="step">
    <h2>أولاً: مهارات الكوميديا اللفظية</h2>
    <textarea id="joke" rows="4" placeholder="اكتب نكتة واحدة هنا"></textarea>
    <br>
    <button onclick="submitJoke()">إرسال</button>
  </div>

  <!-- الخطوة 3: الرفض -->
  <div id="step3" class="step">
    <p>لقد تم تقييم النكتة.</p>
    <p>أنت لست مضحكاً بما يكفي.</p>
    <p>لقد فشلت في الاختبار.</p>
    <div id="exitIcon" onclick="showClown()">🚪</div>
    <img id="clownImage" src="https://cdn-icons-png.flaticon.com/512/7422/7422817.png" alt="مهرج يبكي">
  </div>
</div>

<script>
function startTest() {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
}

function submitJoke() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step3').classList.add('active');
}

function showClown() {
  document.getElementById('clownImage').style.display = 'block';
}
</script>
</body>
</html>
